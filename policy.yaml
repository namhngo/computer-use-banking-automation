# Trusted, app-owned policy for the Harbor Core sandbox. Pure decisions; browser enforcement is separate.
#
# Nothing here is about a goal. It describes the application surface: which pages may be loaded,
# which forms may be submitted (matched by POST path and exact field set on the real DOM), how a
# session is opened, and which interstitial dialogs are benign. Reading visible text on an allowed
# page is always read-only. Everything not listed is denied: script-only buttons, downloads,
# popups, other origins, and any form the page grows later (e.g. "Open sub-account").
schemaVersion: 2
defaultEffect: deny
appId: harbor_core
appVersion: '1.0'
allowedOrigins:
  - http://localhost:4000
  - http://127.0.0.1:4000
# Session credentials are filled at runtime from the environment, never stored in this policy.
session:
  loginPath: /login
  fields: { username: Operator ID, password: Password }
  submit: Sign in
  banner: Harbor Core v1.0
# ':id' matches one opaque record-identifier segment. It is also how identifiers are spelled in evidence.
pages:
  - { path: / }
  - { path: /login, query: { reason: [expired] } }
  - { path: /members/search }
  - { path: '/members/:id' }
  - { path: '/members/:id/accounts' }
  - { path: /notice }
forms:
  - { path: /login, fields: [username, password], risk: reversible }
  - { path: /logout, fields: [], risk: reversible }
  - { path: /members/search, fields: [memberId], risk: read_only }
  - { path: /notice, fields: [], risk: reversible }
# Forms an operator may submit after a same-session handoff, in addition to the automation forms.
humanForms: []
# Automation may act through this interstitial. Any other dialog pauses automation for a person.
knownDialogs:
  - System notice
irreversibleActions: block
